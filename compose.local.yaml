services:
  dinner-planner:
    build: .
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD before starting}
      TODOIST_MODE: local
      DATABASE_PATH: /data/planner.sqlite
      PLANNER_ORIGIN: ${PLANNER_ORIGIN:-http://localhost:8789}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:${PLANNER_PORT:-8789}:8789"
    volumes:
      - planner-local-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  planner-local-data:
