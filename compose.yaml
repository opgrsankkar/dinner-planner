services:
  dinner-planner:
    build: .
    container_name: dinner-planner
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    env_file: .env
    environment:
      # SQLite is the source of truth for planned meals; no Todoist access.
      TODOIST_MODE: local
      DATABASE_PATH: ${DATABASE_PATH:-/data/meals.sqlite3}
      TZ: Asia/Kolkata
      PLANNER_ORIGIN: https://meals.happydaysblr.ddns.net
      ALLOWED_HOSTS: meals.happydaysblr.ddns.net,localhost,127.0.0.1
      # Secret path segment for the read-only calendar feed (see Settings → Calendar).
      ICS_TOKEN: ${ICS_TOKEN:-}
    ports:
      - "172.17.0.1:8789:8789"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
