<!doctype html>
<html lang="en" data-theme-mode="{{ theme_mode }}"{% if theme_mode != 'system' %} data-theme="{{ theme_mode }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="theme-color-light" content="#f7f7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" id="theme-color-dark" content="#111a16" media="(prefers-color-scheme: dark)">
  <title>Meal Planner</title>
  <link rel="stylesheet" href="/static/app.css?v=31">
  <script defer src="/static/planner.bundle.js?v=16"></script>
</head>
<body data-csrf="{{ csrf }}">
  <div id="react-root" data-page="board" data-boot="{{ boot_json|e }}"></div>
  <noscript><main class="error-banner">JavaScript is required to use the Meal Planner.</main></noscript>
</body>
</html>
